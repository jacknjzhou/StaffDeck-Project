name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff
        run: ruff check backend

      # PostgreSQL 集成用例是可选项：仓库变量 STAFFDECK_TEST_PG_URL 为空时
      # conftest_pg.pg_url 会 skip 这些用例，默认不依赖任何数据库服务。
      # 需要跑 PG 用例时，把该变量指向可用的 PostgreSQL（例如本地 compose
      # 服务或其 CI 环境），无需改动工作流。
      - name: Pytest
        env:
          STAFFDECK_TEST_PG_URL: ${{ vars.STAFFDECK_TEST_PG_URL }}
        run: pytest backend/tests -q --timeout=120

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-enterprise/package-lock.json

      - name: Install frontend
        run: npm --prefix frontend-enterprise ci

      - name: Build (tsc + vite)
        run: npm --prefix frontend-enterprise run build

      - name: Vitest
        run: npm --prefix frontend-enterprise test -- --run
