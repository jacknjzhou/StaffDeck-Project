server {
  listen 80;

  # Docker's embedded DNS. Container recreation assigns a new IP, so resolving
  # the upstream once at startup (plain proxy_pass with a hostname) leaves nginx
  # pointing at a dead address until it is reloaded. Using a variable in
  # proxy_pass forces re-resolution per request via the resolver above.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream_api http://api:5173;
    proxy_pass         $upstream_api;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # Required for SSE (Server-Sent Events) long-lived connections
    proxy_buffering        off;
    proxy_cache            off;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;
    proxy_connect_timeout  10s;
  }
}
